<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e0f11">
<title>Virtual Greenhouse — Accès serre</title>
<style>
:root{
 --bg:#0e0f11;--bg2:#17191c;--panel:#16181b;--bd:#2a2e33;--bd2:#333940;
 --tx:#e9ecef;--mt:#8b929b;--mt2:#6b727b;--ok:#25a97e;--cr:#e05252;--ac:#5DCAA5;
}
*{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none!important;}
html{-webkit-text-size-adjust:100%;}
html.pending body{visibility:hidden;}
body{font-family:system-ui,-apple-system,sans-serif;background:
 radial-gradient(1200px 600px at 80% -10%,#14201b 0%,transparent 55%),var(--bg);
 color:var(--tx);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:24px 16px;-webkit-font-smoothing:antialiased;}
main{width:100%;max-width:380px;}
.mark{width:44px;height:44px;border-radius:12px;background:#0c2b20;display:grid;place-items:center;margin-bottom:18px;}
.mark svg{width:24px;height:24px;}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;}
.lead{font-size:13px;color:var(--mt);margin:6px 0 22px;line-height:1.5;}
form{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:18px;
 box-shadow:0 1px 0 rgba(255,255,255,.02) inset,0 2px 8px rgba(0,0,0,.25);}
label{display:block;font-size:12px;color:var(--mt);margin-bottom:7px;}
input{width:100%;background:#0f1113;color:var(--tx);border:1px solid var(--bd2);border-radius:9px;
 padding:11px 12px;font-size:16px;min-height:46px;font-family:inherit;transition:border-color .15s;}
input:focus{outline:none;border-color:var(--ac);}
button{width:100%;margin-top:12px;background:#0c2b20;color:var(--ok);border:1px solid var(--ok);border-radius:9px;
 padding:11px 15px;min-height:46px;cursor:pointer;font-size:15px;font-weight:600;font-family:inherit;
 transition:background .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
button:hover:not(:disabled){background:#0f3527;}
button:disabled{opacity:.5;cursor:default;}
.err{font-size:12.5px;color:var(--cr);margin-top:12px;line-height:1.45;}
.foot{font-size:11.5px;color:var(--mt2);margin-top:16px;line-height:1.55;}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5DCAA5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11 12 4l9 7"/><path d="M5 10v9h14v-9"/><path d="M12 19v-6"/><path d="M12 15c-2 0-3-1.2-3-3 2 0 3 1.2 3 3Z"/><path d="M12 13.5c1.8 0 2.8-1 2.8-2.7-1.8 0-2.8 1-2.8 2.7Z"/>
    </svg>
  </div>
  <h1>Virtual Greenhouse</h1>
  <p class="lead">Saisis le mot de passe de ta serre pour accéder au suivi en direct, à l'historique et au pilotage.</p>

  <form id="f" autocomplete="on">
    <label for="pw">Mot de passe de la serre</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Accéder à la serre</button>
    <div class="err" id="err" role="alert" hidden></div>
  </form>

  <p class="foot">Chaque serre a son propre mot de passe : c'est lui qui désigne la serre ouverte.
    La connexion reste active 30 jours sur cet appareil.</p>
</main>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

// Destination après connexion : uniquement un chemin interne au site.
function target() {
  const n = new URLSearchParams(location.search).get('next') || '';
  return /^\/(?![\/\\])/.test(n) ? n : '/direct';
}

// Déjà connecté sur cet appareil : on entre directement.
document.documentElement.classList.add('pending');
fetch('/api/session', { cache: 'no-store' })
  .then((r) => { if (r.ok) location.replace(target()); else throw 0; })
  .catch(() => document.documentElement.classList.remove('pending'));

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('err').hidden = true;
  $('go').disabled = true;
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value }),
    });
    if (r.ok) { location.replace(target()); return; }
    const j = await r.json().catch(() => ({}));
    throw new Error(j.error || 'Erreur ' + r.status);
  } catch (ex) {
    $('err').textContent = ex.message;
    $('err').hidden = false;
    $('pw').select();
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
